# Builds the website and the RSS feed (feed.xml), then publishes both to GitHub Pages.
# Runs whenever files are changed, every 3 hours (to pick up new rows from the Google Sheet),
# and on demand from the Actions tab ("Run workflow").
name: Build site and RSS feed

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build RSS feed from the Google Sheet
        run: python3 scripts/build_feed.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
